spring.application.name=subscription-platform
 
 spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/saasify
    username: your_db_user
    password: your_db_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: saas-subscription-platform

server:
  port: 8080
 